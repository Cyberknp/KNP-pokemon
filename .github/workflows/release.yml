name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Compile (production)
        run: npm run compile:prod

      - name: Test
        run: npm test

      - name: Package vsix
        run: npx vsce package

      - name: Determine release branch
        id: branch
        run: |
          git fetch origin main
          if git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"; then
            echo "on-main=true" >> "$GITHUB_OUTPUT"
          else
            echo "on-main=false" >> "$GITHUB_OUTPUT"
          fi

      # Always: create a GitHub Release with the .vsix attached.
      # No external service or secret required - this is the guaranteed base
      # distribution channel that anyone can install manually from.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "KNPs Pokémon $GITHUB_REF_NAME" \
            --generate-notes \
            *.vsix

      # Optional: publish to Open VSX (open-vsx.org). No Microsoft/Azure
      # involved - a simple token created on open-vsx.org, stored as the
      # OVSX_PAT secret. Runs on any tag (an Open VSX namespace must exist
      # for the publisher id in package.json).
      - name: Publish to Open VSX
        if: secrets.OVSX_PAT != ''
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          vsix="$(ls *.vsix | head -n 1)"
          npx ovsx publish "$vsix" -p "$OVSX_PAT"

      # Optional: publish to the official VS Code Marketplace. Two auth modes:
      #   A) Entra ID workload identity (no long-lived secret) - recommended.
      #   B) Personal Access Token (VSCE_PAT) - still supported by vsce; note
      #      global PATs retire 2026-12-01.
      # Only runs for tags on main, and only when at least one credential is
      # configured. Skipped entirely otherwise (GitHub Release still created).
      - name: Azure login (Entra ID, optional Marketplace publish)
        if: >-
          steps.branch.outputs.on-main == 'true' &&
          secrets.AZURE_CLIENT_ID != '' &&
          secrets.AZURE_TENANT_ID != ''
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Publish to VS Code Marketplace
        if: >-
          steps.branch.outputs.on-main == 'true' &&
          (secrets.AZURE_CLIENT_ID != '' || secrets.VSCE_PAT != '')
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          vsix="$(ls *.vsix | head -n 1)"
          npx vsce publish --azure-credential --packagePath "$vsix" 2>&1 || \
          npx vsce publish --packagePath "$vsix"
