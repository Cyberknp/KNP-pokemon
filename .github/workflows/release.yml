name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Compile (production)
        run: npm run compile:prod

      - name: Test
        run: npm test

      - name: Package vsix
        run: npx vsce package

      - name: Determine release branch
        id: branch
        run: |
          git fetch origin main
          if git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"; then
            echo "on-main=true" >> "$GITHUB_OUTPUT"
          else
            echo "on-main=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "KNPs Pokémon $GITHUB_REF_NAME" \
            --generate-notes \
            *.vsix

      - name: Publish to VS Code Marketplace
        if: steps.branch.outputs.on-main == 'true' && env.VSCE_PAT != ''
        run: |
          vsix="$(ls *.vsix | head -n 1)"
          npx vsce publish --packagePath "$vsix"